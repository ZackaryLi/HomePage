name: 🚀 Auto Deploy to ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Sync to ~/var/www via SSH Agent
    runs-on: ubuntu-latest
    steps:
      - name: 📥 1. 检出最新仓库代码
        uses: actions/checkout@v4

      - name: 🔐 2. 配置 SSH Agent 并加载私钥
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ECS_SSH_KEY }}

      - name: ⚡ 3. 授信主机指纹并使用 Rsync 同步
        run: |
          # 自动将 ECS 主机指纹写入 known_hosts，避免首次连接中断
          mkdir -p ~/.ssh
          ssh-keyscan -p 22 -H ${{ secrets.ECS_HOST }} >> ~/.ssh/known_hosts

          # 执行 Rsync 增量同步（此时 ssh 会自动通过 ssh-agent 获取密钥，无需指定 -i）
          rsync -avz --delete \
            --chmod=D755,F644 \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='README.md' \
            --exclude='node_modules/' \
            ./ ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}:~/var/www/

      - name: 🩺 4. 远端校验
        run: |
          ssh -p 22 ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }} "echo '✅ 部署成功，当前文件列表：' && ls -lh ~/var/www"