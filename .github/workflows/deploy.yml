name: 🚀 Deploy to ECS Production

on:
  push:
    branches:
      - main # 当推送到 main 分支时自动触发
  workflow_dispatch: # 允许在 GitHub 网页端手动点击按钮一键触发

concurrency:
  group: deploy-production
  cancel-in-progress: true # 如果有新提交，自动取消正在排队或运行中的老任务，只跑最新代码

jobs:
  deploy:
    name: Build and Sync to ECS
    runs-on: ubuntu-latest
    steps:
      - name: 📥 1. 检出代码
        uses: actions/checkout@v4

      # =========================================================================
      # 【可选步骤】如果你的项目是纯静态 HTML/CSS/JS（无需编译），请保持下方注释状态；
      # 如果使用了 Vite / Vue / React / Tailwind 等前端框架，取消下面几行的注释：
      # =========================================================================
      # - name: 🟢 2. 安装 Node.js 环境
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: '20'
      #     cache: 'npm'
      # - name: 🔨 3. 执行前端项目打包
      #   run: |
      #     npm ci
      #     npm run build

      - name: 🔐 4. 配置 SSH 密钥与主机指纹授信
        run: |
          mkdir -p ~/.ssh
          # 关键修复：使用 tr -d '\r' 清理可能存在的 Windows 换行符，避免 libcrypto 解析崩溃
          echo "${{ secrets.ECS_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # 自动获取 ECS SSH 指纹写入 known_hosts
          ssh-keyscan -p 22 -H ${{ secrets.ECS_HOST }} >> ~/.ssh/known_hosts

      - name: ⚡ 5. 通过 Rsync 增量同步至 /var/www/zipperli.com/
        run: |
          # 注意：如果你启用了上面的 npm run build，请将下方源目录 "./" 修改为打包产物目录如 "./dist/"
          rsync -avz --delete \
            --chmod=D755,F644 \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='README.md' \
            --exclude='node_modules/' \
            -e "ssh -i ~/.ssh/id_ed25519 -p 22" \
            ./ ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }}:/var/www/zipperli.com/

      - name: 🩺 6. 验证远端同步结果
        run: |
          ssh -i ~/.ssh/id_ed25519 -p 22 ${{ secrets.ECS_USER }}@${{ secrets.ECS_HOST }} << 'EOF'
            echo "✅ 部署同步完成！/var/www/zipperli.com 当前文件列表："
            ls -lh /var/www/zipperli.com
          EOF