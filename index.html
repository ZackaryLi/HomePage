<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小猪的小窝</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <div class="main-container">

        <!-- 左侧：个人信息侧栏 -->
        <aside class="sidebar glass-card">
            <div class="profile-avatar">🐷</div>
            <h1 class="profile-name">小猪的小窝</h1>
            <p class="profile-quote">记录生活里那些可爱又闪光的瞬间</p>
        </aside>

        <!-- 右侧：内容区 -->
        <main class="content-area">

            <!-- 照片墙 -->
            <section class="content-section glass-card">
                <h2>
                    <span id="contribution-title" class="contribution-title"><i class="fab fa-github"></i> GitHub 贡献图</span>
                    <div id="contribution-header-placeholder" class="contribution-header-placeholder"></div>
                </h2>
                <div class="photo-grid">
                    <!-- 新增照片：复制这个 photo-item 块，替换图片路径和文字 -->
                    <div class="photo-item">
                        <div class="overlay">
                            <h3>小猪第一次请我吃板筋盖饭</h3>
                            <p>很好吃，有点油，但是我点了奶茶</p>
                        </div>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <footer class="site-footer">
        <p>© 2026 小猪的小窝 · zipperli.com</p>
    </footer>

</body>
</html>
